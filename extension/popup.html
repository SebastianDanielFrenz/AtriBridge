<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<h1>Surround upmix</h1>
<label for="layout">Layout</label>
<select id="layout"></select>
<p class="hint" id="hint"></p>
<button id="go">Upmix this tab</button>
<p id="state" role="status"></p>
<hr>
<label class="check"><input type="checkbox" id="pauseOthers"> Pause the other tabs when one starts playing</label>
<button id="addSite" class="secondary">Also pause on this site</button>
<p class="hint" id="siteHint">Works on YouTube, YouTube Music and *.ksfhost.de already.</p>
<p id="warn" class="warn" hidden></p>
<script type="module" src="popup.js"></script>
